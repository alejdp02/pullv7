<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Phoenix Pull</title>
<meta name="theme-color" content="#1456d9" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#eef1f5; --surface:#fff; --ink:#151a23; --muted:#5b6574; --line:#d9dee6;
  --accent:#1456d9; --accent-ink:#fff; --flag:#c2410c; --flag-bg:#ffedd5; --danger:#b42318;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1116; --surface:#171b22; --ink:#eceff4; --muted:#98a2b3; --line:#2a313c;
  --accent:#6b9bff; --accent-ink:#0b1220; --flag:#fdba74; --flag-bg:#3a2210; --danger:#fda29b;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;overflow-x:hidden;-webkit-text-size-adjust:100%}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.muted2{color:var(--muted);font-size:12px}
.right{text-align:right}.mono{font-family:var(--mono)}
.hint{font-size:13px;color:var(--muted)}
.title{font-weight:800;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* controls */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.small-btn{min-height:36px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;max-width:100%}
textarea{padding:10px 12px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px}

/* top bar + sticky toolbar */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:4px;background:var(--accent);display:block;transform:rotate(45deg)}
.who{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.toolbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.toolbar .row+.row{margin-top:8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;min-height:36px;padding:0 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
body[data-mode=find] #quickAdd,body[data-mode=add] #search{display:none}
.total{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap}
.total b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
#categoryChips{display:contents}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip.active,.chip:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.sep{width:1px;background:var(--line);flex:none;margin:4px 2px}

/* sections + items */
#sections{display:grid;gap:14px;grid-template-columns:1fr;align-items:start;padding:14px 0 120px}
@media(min-width:960px){#sections{grid-template-columns:1fr 1fr}}
.sec,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:transparent;border:0;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;text-align:left}
.sec-total{margin-left:auto;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.chev{transition:transform .15s;color:var(--muted)}
.is-collapsed .chev{transform:rotate(-90deg)}
.is-collapsed .list{display:none}
.item-card{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.item-info{flex:1 1 100%;min-width:0}
@media(min-width:640px){.item-info{flex:1 1 0}}
.item-name{font-weight:700;overflow-wrap:anywhere}
.item-meta{font-size:12px;color:var(--muted)}
.item-controls{display:flex;align-items:center;gap:8px;margin-left:auto}
.par-btn{min-height:36px;padding:0 10px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.par-btn:disabled{opacity:.45;cursor:default}
.flag{min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;display:inline-flex;align-items:center;cursor:pointer;position:relative}
.flag input{position:absolute;opacity:0;pointer-events:none}
.flag:has(input:checked){background:var(--flag-bg);border-color:var(--flag);color:var(--flag)}
.flag:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.stepper{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.step{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:22px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;border-radius:12px}
.step:active{background:var(--line)}
.qty-input{width:52px;min-height:44px;height:44px;text-align:center;border:0;background:transparent;font-size:18px;font-weight:800;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 max(10px,env(safe-area-inset-bottom))}
.dock .wrap{display:flex;gap:10px;align-items:center}
.menu{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:6px;min-width:230px}
.menu .btn{width:100%;justify-content:flex-start;border:0;background:transparent}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:80;display:none;max-width:min(560px,92vw);font-weight:600;font-size:14px}
.toast.show{display:block}

/* dialogs */
dialog{border:0;padding:0;border-radius:16px;width:min(760px,calc(100vw - 24px));max-height:min(88dvh,760px);color:var(--ink);background:var(--surface);box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.5)}
.modal-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex:none}
.modal-body{padding:16px;overflow:auto;flex:1;min-height:0}
@media(max-width:600px){dialog{width:100vw;max-width:100vw;max-height:92dvh;margin:auto 0 0;border-radius:16px 16px 0 0}}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.scroll{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
.table th,.table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.table th{color:var(--muted);font-weight:700}
.table .right{text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

/* login */
#view-login{min-height:100dvh;display:grid;place-items:center;padding:20px 14px}
.login{width:min(420px,100%)}
.login .card{padding:22px}
.login h1{font-size:26px;margin:14px 0 4px;letter-spacing:-.02em}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script defer src="app.js"></script>
</head>
<body data-mode="find">

<!-- LOGIN -->
<section id="view-login">
  <div class="login">
    <div class="brand"><i></i>Phoenix Pull</div>
    <div class="card">
      <h1 class="title">Sign in</h1>
      <div class="muted">Start your pull list for the shift.</div>
      <form id="loginForm" class="form" style="margin-top:18px">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" required />
        <input id="loginPass" type="password" placeholder="Password (leave blank for an email link)" autocomplete="current-password" />
        <button class="btn primary" type="submit">Sign in</button>
        <button id="magicLinkBtn" class="btn" type="button">Email me a sign-in link</button>
      </form>
      <div class="row" style="margin-top:14px;justify-content:space-between;flex-wrap:wrap">
        <button id="openSignup" class="btn ghost small-btn" type="button">Create account</button>
        <button id="resetPw" class="btn ghost small-btn" type="button">Reset password</button>
      </div>
      <div id="loginMsg" class="hint" role="status" style="margin-top:8px"></div>
    </div>
  </div>

  <dialog id="signupDlg">
    <div class="modal-head"><div class="title">Create account</div><div class="spacer"></div><button class="btn small-btn" id="closeSignup" type="button">Close</button></div>
    <div class="modal-body">
      <form id="signupForm" class="form">
        <input id="signupName" type="text" placeholder="Display name (optional)" />
        <input id="signupEmail" type="email" placeholder="Email" required />
        <input id="signupPass" type="password" placeholder="Password" autocomplete="new-password" required />
        <button class="btn primary" type="submit">Create account</button>
      </form>
    </div>
  </dialog>
</section>

<!-- APP -->
<section id="view-app" class="hidden">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><i></i>Pull list</div>
      <span class="save" id="saveState">Ready</span>
      <div class="who" id="whoBadge">…</div>
      <button id="adminOpen" class="btn small-btn" type="button">Admin</button>
      <button id="logoutBtn" class="btn small-btn" type="button">Log out</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="wrap">
      <div class="row">
        <div class="seg" role="group" aria-label="Mode">
          <button type="button" data-mode-btn="find" aria-pressed="true">Find</button>
          <button type="button" data-mode-btn="add" aria-pressed="false">Add</button>
        </div>
        <input id="search" class="grow" type="search" placeholder="Search items" autocomplete="off" />
        <input id="quickAdd" class="grow" type="text" placeholder="2 croissant, muffin x3, then Enter" autocomplete="off" enterkeyhint="done" />
        <div class="total"><span>Total</span><b id="totalAll">0</b></div>
      </div>
      <div class="row">
        <div class="chips">
          <div id="categoryChips"></div>
          <span class="sep"></span>
          <label class="chip"><input id="onlyQty" type="checkbox" />Has qty</label>
          <label class="chip"><input id="onlyRestock" type="checkbox" />Restock</label>
        </div>
      </div>
    </div>
  </div>

  <main class="wrap"><div id="sections"></div></main>

  <div class="dock">
    <div class="wrap" style="position:relative">
      <button id="undoBtn" class="btn" type="button" aria-label="Undo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo
      </button>
      <button id="pullSheetBtn" class="btn primary grow" type="button">Pull sheet</button>
      <button id="moreBtn" class="btn" type="button" aria-label="More actions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <div id="moreMenu" class="menu hidden">
        <button id="setVisibleToPar" class="btn" type="button">Set visible items to PAR</button>
        <button id="resetShift" class="btn danger" type="button">Start fresh shift</button>
      </div>
    </div>
  </div>

  <dialog id="sheetDlg">
    <div class="modal-head"><div class="title">Pull sheet</div><div class="spacer"></div>
      <button class="btn small-btn" id="copySheet" type="button">Copy</button>
      <button class="btn small-btn" id="closeSheet" type="button">Close</button></div>
    <div class="modal-body">
      <div class="hint">Items with a quantity above 0, grouped by category.</div>
      <div id="sheetBody" style="margin-top:12px"></div>
    </div>
  </dialog>

  <dialog id="adminDlg">
    <div class="modal-head"><div class="title">Admin</div><span class="badge" id="roleBadge">role: ?</span><div class="spacer"></div>
      <button class="btn small-btn" id="closeAdmin" type="button">Close</button></div>
    <div class="modal-body">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="items" aria-selected="true">Items</button>
        <button type="button" data-tab="users" aria-selected="false">Users</button>
        <button type="button" data-tab="logs" aria-selected="false">Logs</button>
      </div>

      <section id="tab-items">
        <div class="tools"><div class="spacer"></div><button id="addItemBtn" class="btn primary small-btn" type="button">Add item</button></div>
        <div id="itemsTableWrap" class="card scroll"></div>
        <div class="hint" style="margin-top:8px">Deactivate an item to hide it without deleting its history.</div>
      </section>

      <section id="tab-users" class="hidden"><div id="usersTableWrap" class="card scroll"></div></section>

      <section id="tab-logs" class="hidden">
        <div class="tools">
          <select id="logUserFilter"></select>
          <select id="logActionFilter">
            <option value="all">All actions</option>
            <option value="qty_change">Quantity changed</option>
            <option value="restock_toggle">Restock toggled</option>
            <option value="set_par">Set to PAR</option>
            <option value="pull_sheet_open">Pull sheet opened</option>
            <option value="login">Login</option>
            <option value="logout">Logout</option>
          </select>
          <div class="spacer"></div>
          <button id="exportCSV" class="btn small-btn" type="button">Export CSV</button>
          <button id="clearLogs" class="btn danger small-btn" type="button">Clear logs</button>
        </div>
        <div id="logsTableWrap" class="card scroll"></div>
      </section>
    </div>
  </dialog>

  <dialog id="itemEditDlg">
    <div class="modal-head"><div class="title" id="itemEditTitle">Item</div><div class="spacer"></div>
      <button class="btn small-btn" id="closeItemEdit" type="button">Close</button></div>
    <div class="modal-body">
      <form id="itemEditForm" class="form">
        <input type="hidden" id="itemId" />
        <div class="two">
          <input id="itemCategory" placeholder="Category (e.g. Pastries)" required />
          <input id="itemName" placeholder="Item name" required />
        </div>
        <div class="two">
          <input id="itemPar" type="number" min="0" placeholder="PAR (optional)" />
          <input id="itemShelf" placeholder="Shelf (optional)" />
        </div>
        <textarea id="itemNote" placeholder="Note (optional), e.g. 6–8 depending on day" rows="3"></textarea>
        <label class="toggle"><input id="itemActive" type="checkbox" checked /><span>Active</span></label>
        <div class="row" style="justify-content:flex-end">
          <button id="deleteItemBtn" class="btn danger" type="button">Delete</button>
          <button class="btn primary" type="submit">Save item</button>
        </div>
      </form>
    </div>
  </dialog>
</section>

<div id="toast" class="toast" role="status"></div>
</body>
</html>
